<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo Rivera Carrillo | Portafolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            /* Imagen de fondo simulando el cielo/nubes estilo tu amigo */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1600&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 700px;
            padding: 20px;
        }
        /* Foto de perfil circular */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2.2rem;
            margin: 10px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .contact-info {
            font-size: 1rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        .tagline {
            font-size: 1.05rem;
            margin-bottom: 30px;
            line-height: 1.5;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        /* Etiquetas estilo píldora de colores */
        .tags-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .tag-dev { background-color: #e91e63; }
        .tag-vr { background-color: #2196f3; }
        .tag-xr { background-color: #009688; }
        .tag-inv { background-color: #f44336; }

        /* Sección de redes o accesos */
        .section-links {
            margin-top: 20px;
        }
        .link-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.2s;
        }
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Aquí puedes cambiar el enlace de la imagen por tu foto de perfil real -->
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=300&auto=format&fit=crop" alt="Ricardo Rivera" class="profile-img">

        <h1>Ricardo Rivera Carrillo</h1>
        <div class="contact-info">contacto@tucorreo.com | @TuUsuario</div>

        <p class="tagline">
            Ingeniero en Animación y Efectos Visuales | Desarrollo de Mundos Virtuales, Realidad Extendida (XR) y Automatización de Procesos.
        </p>

        <!-- Etiquetas de especialidades estilo la página de tu amigo -->
        <div class="tags-wrapper">
            <span class="tag tag-dev">Desarrollo 3D</span>
            <span class="tag tag-vr">Mundos Virtuales</span>
            <span class="tag tag-xr">Realidad Inmersiva</span>
            <span class="tag tag-inv">Investigación</span>
        </div>

        <div class="section-links">
            <a href="tesis.html" class="link-btn">📁 Ver Documentos de Maestría</a>
        </div>
    </div>

</body>
</html>
