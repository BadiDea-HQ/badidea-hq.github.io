<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo Rivera Carrillo</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), 
                        url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1600&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 750px;
            padding: 20px;
        }

        /* ESTILO DEL ICONO DE PERFIL CIRCULAR */
        .profile-img {
            width: 140px;
            height: 140px;
            aspect-ratio: 1 / 1;          /* Asegura que siempre sea un cuadrado perfecto */
            border-radius: 50%;          /* Transforma el cuadrado en un círculo perfecto */
            object-fit: cover;           /* Recorta la imagen al centro sin deformar la cara */
            object-position: center;     /* Centra la cara dentro del círculo */
            border: 3px solid rgba(255, 255, 255, 0.85); /* Borde blanco sutil */
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);       /* Sombra para darle profundidad */
        }

        h1 {
            font-size: 2.6rem;
            margin: 0 0 10px 0;
            font-weight: normal;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .email {
            font-size: 1.15rem;
            margin-bottom: 20px;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }
        .bio {
            font-size: 1.1rem;
            margin-bottom: 35px;
            line-height: 1.5;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        
        /* Contenedor de etiquetas */
        .tags-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .tags-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .tag {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 500;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        /* Colores de las etiquetas */
        .tag-diseno { background-color: #e91e63; }
        .tag-mundos { background-color: #2196f3; }
        .tag-educacion { background-color: #4caf50; }
        .tag-investigacion { background-color: #f44336; }
        .tag-ia { background-color: #ff9800; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Reemplaza foto.jpg si le pusiste otro nombre a tu archivo en GitHub -->
        <img src="foto.jpg" alt="Ricardo Rivera Carrillo" class="profile-img">

        <h1>Ricardo Rivera Carrillo</h1>
        
        <div class="email">riveracarrillorrc@gmail.com</div>

        <div class="bio">
            Maestrante en Didáctica de las Ciencias: Matemáticas &nbsp;|&nbsp; Ingeniero en Animación &nbsp;|&nbsp; Investigador en Tecnología Inmersiva
        </div>

        <!-- Distribución de botones: 2 arriba y 3 abajo -->
        <div class="tags-container">
            <div class="tags-row">
                <span class="tag tag-diseno">Diseño y Composición Visual</span>
                <span class="tag tag-mundos">Mundos Virtuales</span>
            </div>
            <div class="tags-row">
                <span class="tag tag-educacion">Educación</span>
                <span class="tag tag-investigacion">Investigación</span>
                <span class="tag tag-ia">IA Inmersiva</span>
            </div>
        </div>
    </div>

</body>
</html>
